name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      # 4. Regenerate Gradle Wrapper
      - name: Regenerate Gradle Wrapper
        run: |
          echo "=== Regenerating Gradle Wrapper with Gradle 8.10.2 ==="
          gradle wrapper --gradle-version 8.10.2 --distribution-type all

      # 5. Setup Debug Keystore
      - name: Setup Debug Keystore
        run: |
          echo "=== Setting up debug keystore ==="
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding DEBUG_KEYSTORE_BASE64 secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists in repository."
          fi
          ls -la debug.keystore

      # 6. Make Gradle Wrapper Executable
      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x ./gradlew

      # 7. Run Lint
      - name: Run Lint
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"
        run: |
          echo "=== Running Android Lint ==="
          ./gradlew lintDebug --no-daemon --stacktrace

      # 8. Run Local JVM Unit Tests
      - name: Run Local JVM Unit Tests
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"
        run: |
          echo "=== Running Local JVM Unit Tests ==="
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # 9. Build Debug APK
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"
        run: |
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Upload Build Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
